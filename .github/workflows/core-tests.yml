name: CPU spectral kernel tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.17.1 pytest==9.1.1
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare FFT kernels and gradients with independent references
        run: python -m pytest -q tests/test_fft_kernels.py
